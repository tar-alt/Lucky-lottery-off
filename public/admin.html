## 🛠 တည်ဆောက်ပုံ အနှစ်ချုပ် (Key Features)

1. **Real-time Synchronization (Socket.io):** ကစားသူ အားလုံးမှာ တပြိုင်နက်တည်း Timer ပတ်နေမည်။ Admin က ရလဒ်ပြောင်းလိုက်တာနဲ့ ကစားသူအားလုံးဆီ အချိန်ကိုက် ရောက်ရှိမည်။
2. **Admin Control:** နံပါတ် အပိုင်သတ်မှတ်ရန် Control Module ပါဝင်မည်။ သတ်မှတ်မထားပါက Random အလိုအလျောက် ထွက်မည်။ User Balance နှင့် Deposit/Withdraw များကို Direct Update လုပ်နိုင်မည်။
3. **Auto Login / Persistent Session:** LocalStorage (သို့) JWT/Session token အသုံးပြု၍ မည်မျှပင် Browser ပိတ်/ဖွင့်လုပ်သည်ဖြစ်စေ Auto-Login ဖြစ်နေမည်။
4. **WinGo Style Game UI:** ဓာတ်ပုံ ၃ ပါအတိုင်း ရောင်စုံ ခလုတ်များ၊ အကြီး/အသေး၊ ၀-၉ ဂဏန်းများ ပါဝင်သည့် Dark Modern Betting Dashboard။
