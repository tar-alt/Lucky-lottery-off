<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard Control</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { background: #0f172a; color: white; font-family: sans-serif; padding: 20px; }
    .card { background: #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 20px; border: 1px solid #334155; }
    h2, h3 { color: #f1c40f; margin-bottom: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #334155; padding: 8px; text-align: center; font-size: 14px; }
    th { background: #0f172a; color: #94a3b8; }
    input, button { padding: 10px; border-radius: 6px; border: 1px solid #334155; margin: 5px 0; }
    input { background: #0f172a; color: white; width: 100%; }
    button { background: #10b981; color: white; font-weight: bold; cursor: pointer; border: none; width: 100%; }
    .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; background: #2563eb; }
  </style>
</head>
<body>

  <h2>⚙️ Realtime Admin Control Panel</h2>
  
  <div class="card">
    <h3>📊 Game Live Stats</h3>
    <div>လက်ရှိ ကစားနေသူ ဦးရေ (Online Users): <span id="onlineCount" class="badge">0</span></div>
    <div style="margin-top:10px;">
      <b>အများဆုံး လောင်းကြေးတင်ထားသော အမျိုးအစား:</b>
      <div id="topBetCategory" style="color:#f97316; font-size:18px; font-weight:bold; margin-top:5px;">မရှိသေးပါ</div>
    </div>
  </div>

  <div class="card">
    <h3>💰 Deposit / Withdraw Unit (By Phone Number)</h3>
    <input type="text" id="targetPhone" placeholder="User Phone Number (e.g. 09123456789)">
    <input type="number" id="unitAmount" placeholder="Amount (e.g. 5000 or -2000)">
    <button onclick="updateUserUnit()">Update Balance</button>
  </div>

  <div class="card">
    <h3>👥 Registered Users List & Balances</h3>
    <table>
      <thead>
        <tr>
          <th>Phone Number</th>
          <th>Balance (Kyats)</th>
        </tr>
      </thead>
      <tbody id="userTableBody"></tbody>
    </table>
  </div>

<script>
  const socket = io();

  // Admin connect ဖြစ်သည်နှင့် Data များ တောင်းမည်
  socket.emit('admin_init');

  socket.on('admin_data', (data) => {
    document.getElementById('onlineCount').innerText = data.onlineUsers;
    renderUserList(data.users);
    renderTopBets(data.betsSummary);
  });

  function renderUserList(users) {
    const tbody = document.getElementById('userTableBody');
    tbody.innerHTML = Object.keys(users).map(phone => `
      <tr>
        <td>${phone}</td>
        <td style="color:#f1c40f; font-weight:bold;">K${users[phone].balance.toLocaleString()}</td>
      </tr>
    `).join('');
  }

  function renderTopBets(summary) {
    if (!Object.keys(summary).length) {
      document.getElementById('topBetCategory').innerText = "လက်ရှိ ပွဲစဉ်တွင် လောင်းကြေး မရှိသေးပါ";
      return;
    }
    let maxVal = 0;
    let topCat = '';
    for (let cat in summary) {
      if (summary[cat] > maxVal) {
        maxVal = summary[cat];
        topCat = cat;
      }
    }
    document.getElementById('topBetCategory').innerText = `${topCat} (စုစုပေါင်း K${maxVal.toLocaleString()})`;
  }

  function updateUserUnit() {
    const phone = document.getElementById('targetPhone').value.trim();
    const amount = parseFloat(document.getElementById('unitAmount').value);

    if (!phone || isNaN(amount)) return alert('ဖုန်းနံပါတ် နှင့် ပမာဏ မှန်ကန်စွာ ဖြည့်ပါ');

    socket.emit('admin_update_balance', { phone, amount });
    document.getElementById('targetPhone').value = '';
    document.getElementById('unitAmount').value = '';
  }

  socket.on('admin_action_success', (msg) => {
    alert(msg);
  });
</script>
</body>
</html>
