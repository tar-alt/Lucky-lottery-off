ဒါတွေကို ဖြည့်ဆည်းဖို့အတွက် backend ရော frontend မှာပါ ထည့်သွင်းပေးရမယ့် အပိုင်းတွေကို အောက်မှာ ခွဲခြားဖော်ပြပေးထားပါတယ်။

## ၁။ ထွက်ဂဏန်း ပြောင်းလဲခြင်း/သတ်မှတ်ခြင်း (Winning Number Control)

ဂဏန်းထွက်မယ့်အချိန်မတိုင်မီ သို့မဟုတ် Admin က ကြိုက်တဲ့အချိန်မှာ ထွက်ဂဏန်းကို စိတ်ကြိုက် ပြောင်းလို့ရအောင် လုပ်ဆောင်ပေးရပါမယ်။

*   **UI မှာ ထည့်ရန်:** 
    *   "Set Winning Number" သို့မဟုတ် "Manage Results" ဆိုတဲ့ Card/Section တစ်ခု ထည့်ပါ။
    *   ထွက်မယ့်ဂဏန်း ရိုက်ထည့်ရမယ့် Input box ၊ ထွက်မယ့်အချိန် (Round/Session) ရွေးရန် Dropdown နဲ့ **"Set Result"** / **"Force Win Number"** Button ထည့်ပေးရပါမယ်။
*   **Backend Logic:**
    *   Admin က ရွေးလိုက်တဲ့ ဂဏန်းကို Database (သို့မဟုတ် Server state) ထဲမှာ သွားသိမ်းပြီး၊ မဲဖွင့်ချိန် ရောက်တဲ့အခါ အဲဒီသတ်မှတ်ထားတဲ့ ဂဏန်းအတိုင်းပဲ ထွက်ပေးသွားအောင် ရေးပေးရပါမယ်။

## ၂။ User များ အားလုံးကို စာရင်းကြည့်ခြင်းနှင့် ထိန်းချုပ်ခြင်း (User Management)

လက်ရှိမှာ User list မပေါ်တဲ့အတွက် User အကောင့်များကို စီမံခန့်ခွဲနိုင်မယ့် Table တစ်ခု သီးသန့် လိုအပ်ပါတယ်။

*   **UI မှာ ထည့်ရန်:**
    *   **User List Table:** User Name, Player ID, Balance (လက်ကျန်ငွေ/ယူနစ်), Status (Active/Banned), Actions (Edit, Ban, Delete) စတာတွေ ပါဝင်တဲ့ ဇယားတစ်ခု ထည့်ပါ။
*   **Admin ရရှိမယ့် ထိန်းချုပ်မှုများ (Control Features):**
    *   **Block / Ban User:** မရိုးမသားလုပ်သော သို့မဟုတ် ပြဿနာရှိသော User ၏ အကောင့်ကို ပိတ်ထားနိုင်ခြင်း။
    *   **Edit Balance:** User တစ်ဦးစီ၏ Balance ကို တိုက်ရိုက် တိုး/လျှော့ စိတ်ကြိုက် ပြင်နိုင်ခြင်း။
    *   **Reset Password:** User ၏ Password ကို ပြန်လည်ပြင်ဆင်ပေးနိုင်ခြင်း။

## ၃။ Bet History / User များ ထိုးထားသော ဂဏန်းများ ကြည့်ရှုခြင်း

ထွက်ဂဏန်း ပြောင်းရာတွင် မည်သည့်ဂဏန်းကို အများဆုံးထိုးထားသည်၊ မည်သည့်ဂဏန်းထွက်လျှင် အမြတ်/အရှုံး ရှိမည်ကို Admin က အရင်ဆုံး သိနိုင်ရန် လိုအပ်ပါတယ်။

*   **UI မှာ ထည့်ရန်:**
    *   **Live Bets Section:** ယခု Round/Session ထဲမှာ User တွေ ဘာဂဏန်းတွေ ထိုးထားလဲ၊ ဘယ်ဂဏန်းမှာ Total Amount ဘယ်လောက်ရှိလဲဆိုတာ စာရင်းချုပ် (Summary) ပြပေးသည့် ဇယား။
*   **အကျိုးကျေးဇူး:**
    *   Admin အနေဖြင့် User တွေ ထိုးထားသည့် ဂဏန်းများကို ကြည့်ပြီးမှ ထွက်ဂဏန်း (Winning Number) ကို စိတ်ကြိုက် ပြောင်းလဲ သတ်မှတ်နိုင်မည်ဖြစ်သည်။
