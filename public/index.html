<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lucky Lottery - WinGo</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-main: linear-gradient(180deg, #0f172a 0%, #1e293b 40%, #0f172a 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --green-3d: linear-gradient(180deg, #10b981 0%, #059669 100%);
      --violet-3d: linear-gradient(180deg, #a855f7 0%, #7e22ce 100%);
      --red-3d: linear-gradient(180deg, #ef4444 0%, #dc2626 100%);
      --orange-3d: linear-gradient(180deg, #f97316 0%, #ea580c 100%);
      --blue-3d: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%);
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { background: #020617; color: white; display: flex; justify-content: center; }
    .app { width: 100%; max-width: 480px; min-height: 100vh; background: var(--bg-main); padding: 12px; position: relative; padding-bottom: 40px; }

    /* Auth Modal Overlay */
    #authOverlay { position: fixed; inset: 0; background: #0f172a; z-index: 2000; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .auth-card { background: #1e293b; width: 100%; max-width: 400px; padding: 25px; border-radius: 20px; border: 1px solid var(--card-border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
    .auth-input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 14px; outline: none; }
    .auth-btn { width: 100%; padding: 12px; background: var(--green-3d); border: none; border-radius: 10px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 0 #047857; }
    .auth-toggle { margin-top: 15px; font-size: 13px; color: #60a5fa; cursor: pointer; text-decoration: underline; }

    /* Layout Elements */
    .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--card-border); margin-bottom: 12px; }
    .brand-title { font-size: 20px; font-weight: 900; background: linear-gradient(90deg, #f39c12, #f1c40f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .wallet-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 16px; text-align: center; backdrop-filter: blur(10px); box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
    .balance-val { font-size: 28px; font-weight: 800; color: #f1c40f; margin: 6px 0 14px; }
    .wallet-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn-3d { border: none; padding: 12px; border-radius: 14px; color: white; font-weight: bold; font-size: 14px; cursor: pointer; transition: all 0.1s ease; position: relative; }
    .btn-withdraw { background: var(--red-3d); box-shadow: 0 4px 0 #b91c1c; }
    .btn-deposit { background: var(--green-3d); box-shadow: 0 4px 0 #047857; }
    
    .ticket-card { background: linear-gradient(135deg, #1e1b4b, #312e81); border-radius: 16px; padding: 14px 18px; color: white; margin: 15px 0; display: flex; justify-content: space-between; align-items: center; border: 1px solid #4338ca; }
    .time-digits { background: #020617; color: #ef4444; font-size: 20px; font-weight: 900; padding: 6px 12px; border-radius: 8px; border: 1px solid #dc2626; font-family: monospace; }
    .color-section { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .btn-color-green { background: var(--green-3d); box-shadow: 0 5px 0 #047857; }
    .btn-color-violet { background: var(--violet-3d); box-shadow: 0 5px 0 #6b21a8; }
    .btn-color-red { background: var(--red-3d); box-shadow: 0 5px 0 #b91c1c; }
    .grid-balls { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; background: var(--card-bg); padding: 16px; border-radius: 20px; border: 1px solid var(--card-border); margin-bottom: 15px; }
    .ball-3d { aspect-ratio: 1; border-radius: 50%; border: none; font-size: 20px; font-weight: 900; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    .ball-0 { background: radial-gradient(circle at 35% 35%, #c084fc, #7e22ce); box-shadow: 0 6px 0 #581c87; }
    .ball-5 { background: radial-gradient(circle at 35% 35%, #34d399, #047857); box-shadow: 0 6px 0 #064e3b; }
    .ball-green { background: radial-gradient(circle at 35% 35%, #34d399, #059669); box-shadow: 0 6px 0 #047857; }
    .ball-red { background: radial-gradient(circle at 35% 35%, #f87171, #dc2626); box-shadow: 0 6px 0 #991b1b; }
    .size-section { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .btn-big { background: var(--orange-3d); box-shadow: 0 5px 0 #c2410c; }
    .btn-small { background: var(--blue-3d); box-shadow: 0 5px 0 #1d4ed8; }

    /* Modals */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: flex-end; z-index: 1000; backdrop-filter: blur(5px); }
    .modal-content { background: #1e293b; border-top-left-radius: 24px; border-top-right-radius: 24px; width: 100%; max-width: 480px; padding: 20px; border-top: 1px solid var(--card-border); color: white; }
    .btn-submit { width: 100%; padding: 14px; background: var(--green-3d); border: none; border-radius: 12px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 0 #047857; margin-top: 10px; }
    .btn-close { width: 100%; padding: 12px; background: #475569; border: none; border-radius: 12px; color: white; font-weight: bold; margin-top: 8px; cursor: pointer; }
    .chips { display: flex; gap: 8px; margin: 10px 0; }
    .chip { flex: 1; padding: 8px; border-radius: 8px; background: #0f172a; border: 1px solid #334155; text-align: center; font-size: 12px; cursor: pointer; }
    .chip.active { background: var(--orange-3d); border-color: #f97316; }
  </style>
</head>
<body>

<!-- Login & Register Overlay -->
<div id="authOverlay">
  <div class="auth-card">
    <h2 id="authTitle" style="color:#f1c40f; margin-bottom: 15px;">Lucky Lottery Login</h2>
    <input type="text" id="authPhone" class="auth-input" placeholder="ဖုန်းနံပါတ် ရိုက်ထည့်ပါ">
    <input type="password" id="authPassword" class="auth-input" placeholder="စကားဝှက် ရိုက်ထည့်ပါ">
    <button class="auth-btn" id="authSubmitBtn" onclick="handleAuth()">လော့ဂ်အင်ဝင်မည်</button>
    
    <div class="auth-toggle" id="authToggleBtn" onclick="toggleAuthMode()">
      အကောင့်မရှိသေးပါက ဒီမှာ အကောင့်သစ်ဖွင့်ပါ (Register)
    </div>
  </div>
</div>

<div class="app">
  <div class="header">
    <div class="brand-title">🎰 Lucky Lottery</div>
    <div id="userDisplay" style="font-size: 13px; color: #94a3b8;">Guest</div>
  </div>

  <div class="wallet-card">
    <div style="font-size: 13px; color: #94a3b8;">Wallet balance</div>
    <div class="balance-val" id="balanceDisplay">K0.00</div>
  </div>

  <div class="ticket-card">
    <div>
      <div style="font-size: 14px; font-weight: bold;">Win Go 30s</div>
      <small id="periodDisplay" style="color:#94a3b8;">P: Loading...</small>
    </div>
    <div>
      <div class="time-digits" id="timerDisplay">00:30</div>
    </div>
  </div>

  <!-- Color Buttons -->
  <div class="color-section">
    <button class="btn-3d btn-color-green" onclick="openBetModal('color', 'Green')">Green</button>
    <button class="btn-3d btn-color-violet" onclick="openBetModal('color', 'Violet')">Violet</button>
    <button class="btn-3d btn-color-red" onclick="openBetModal('color', 'Red')">Red</button>
  </div>

  <!-- Ball Grid -->
  <div class="grid-balls">
    <button class="ball-3d ball-0" onclick="openBetModal('number', 0)">0</button>
    <button class="ball-3d ball-green" onclick="openBetModal('number', 1)">1</button>
    <button class="ball-3d ball-red" onclick="openBetModal('number', 2)">2</button>
    <button class="ball-3d ball-green" onclick="openBetModal('number', 3)">3</button>
    <button class="ball-3d ball-red" onclick="openBetModal('number', 4)">4</button>
    <button class="ball-3d ball-5" onclick="openBetModal('number', 5)">5</button>
    <button class="ball-3d ball-red" onclick="openBetModal('number', 6)">6</button>
    <button class="ball-3d ball-green" onclick="openBetModal('number', 7)">7</button>
    <button class="ball-3d ball-red" onclick="openBetModal('number', 8)">8</button>
    <button class="ball-3d ball-green" onclick="openBetModal('number', 9)">9</button>
  </div>

  <!-- Big / Small Buttons -->
  <div class="size-section">
    <button class="btn-3d btn-big" onclick="openBetModal('size', 'Big')">Big</button>
    <button class="btn-3d btn-small" onclick="openBetModal('size', 'Small')">Small</button>
  </div>
</div>

<!-- Bet Modal Drawer -->
<div class="modal-overlay" id="betDrawer">
  <div class="modal-content">
    <div style="font-size:18px; font-weight:bold; color:#f97316; margin-bottom:10px;">
      Select: <span id="selectedItem"></span>
    </div>
    <div style="font-size:13px; margin-bottom:5px;">Amount Base:</div>
    <div class="chips">
      <div class="chip" onclick="setBaseAmt(100)">100</div>
      <div class="chip active" id="defaultChip" onclick="setBaseAmt(1000)">1000</div>
      <div class="chip" onclick="setBaseAmt(5000)">5000</div>
      <div class="chip" onclick="setBaseAmt(10000)">10000</div>
    </div>
    <button class="btn-submit" onclick="submitBet()">Confirm Bet - Total K<span id="totalBetAmount">1000</span></button>
    <button class="btn-close" onclick="closeModals()">မလုပ်တော့ပါ</button>
  </div>
</div>

<script>
  const socket = io();
  let isRegisterMode = false;
  let currentUser = null;
  let activeBet = { type: '', value: '', baseAmt: 1000 };

  // LocalStorage စစ်ဆေးပြီး အော်တို ရိုက်ထည့်ပေးထားမည်
  window.onload = () => {
    const savedPhone = localStorage.getItem('saved_phone');
    const savedPass = localStorage.getItem('saved_pass');
    if (savedPhone && savedPass) {
      document.getElementById('authPhone').value = savedPhone;
      document.getElementById('authPassword').value = savedPass;
    }
  };

  function toggleAuthMode() {
    isRegisterMode = !isRegisterMode;
    document.getElementById('authTitle').innerText = isRegisterMode ? 'Lucky Lottery Register' : 'Lucky Lottery Login';
    document.getElementById('authSubmitBtn').innerText = isRegisterMode ? 'အကောင့်သစ်ဖွင့်မည်' : 'လော့ဂ်အင်ဝင်မည်';
    document.getElementById('authToggleBtn').innerText = isRegisterMode ? 'အကောင့်ရှိပြီးသားပါက Login ဝင်ပါ' : 'အကောင့်မရှိသေးပါက ဒီမှာ အကောင့်သစ်ဖွင့်ပါ (Register)';
  }

  function handleAuth() {
    const phone = document.getElementById('authPhone').value.trim();
    const password = document.getElementById('authPassword').value.trim();

    if (!phone || !password) return alert('ဖုန်းနံပါတ် နှင့် စကားဝှက် ဖြည့်ပါ');

    if (isRegisterMode) {
      socket.emit('register', { phone, password });
    } else {
      socket.emit('login', { phone, password });
    }
  }

  socket.on('auth_response', (res) => {
    if (res.success) {
      // Memory တွင် မှတ်ထားပေးမည်
      localStorage.setItem('saved_phone', res.user.phone);
      localStorage.setItem('saved_pass', res.user.password);

      currentUser = res.user;
      document.getElementById('userDisplay').innerText = currentUser.phone;
      document.getElementById('balanceDisplay').innerText = `K${currentUser.balance.toLocaleString()}`;
      document.getElementById('authOverlay').style.display = 'none';
      alert(res.message);
    } else {
      alert(res.message);
    }
  });

  socket.on('balance_update', (newBalance) => {
    if (currentUser) {
      currentUser.balance = newBalance;
      document.getElementById('balanceDisplay').innerText = `K${newBalance.toLocaleString()}`;
    }
  });

  socket.on('timer_update', (data) => {
    let secs = data.timer < 10 ? '0' + data.timer : data.timer;
    document.getElementById('timerDisplay').innerText = `00:${secs}`;
    document.getElementById('periodDisplay').innerText = `P: ${data.period}`;
  });

  function openBetModal(type, val) {
    if (!currentUser) return alert('လော့ဂ်အင် အရင်ဝင်ပါ');
    activeBet.type = type;
    activeBet.value = val;
    document.getElementById('selectedItem').innerText = val;
    document.getElementById('betDrawer').style.display = 'flex';
  }

  function setBaseAmt(amt) {
    activeBet.baseAmt = amt;
    document.getElementById('totalBetAmount').innerText = amt.toLocaleString();
  }

  function closeModals() {
    document.getElementById('betDrawer').style.display = 'none';
  }

  function submitBet() {
    if (currentUser.balance < activeBet.baseAmt) {
      return alert('လက်ကျန်ငွေ မလုံလောက်ပါ။');
    }
    socket.emit('place_bet', {
      phone: currentUser.phone,
      bet: activeBet,
      amount: activeBet.baseAmt
    });
    closeModals();
  }
</script>
</body>
</html>
